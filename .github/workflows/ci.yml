name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      # Type checking must use TypeScript 7, the native (Go) compiler.
      - name: Check TypeScript is 7.x (native compiler)
        run: npx tsc --version | tee /dev/stderr | grep -Eq '^Version 7\.'

      - name: Format (oxfmt)
        run: |
          npx oxfmt --check || {
            npx oxfmt --list-different | sed 's/.*/::error file=&::Not formatted with oxfmt. Run npm run format (or the Format workflow)./'
            exit 1
          }

      - name: Lint (oxlint, type-aware)
        run: |
          npx oxlint --format=github || {
            # GitHub shows at most 10 errors and 10 warnings per step; add one annotation with the full report.
            report=$(npx oxlint --format=unix 2>&1 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=oxlint full report::${report}"
            exit 1
          }

      - run: npm run typecheck
      - run: npm test
