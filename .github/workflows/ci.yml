name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      # Type checking must use TypeScript 7, the native (Go) compiler.
      - name: Check TypeScript is 7.x (native compiler)
        run: npx tsc --version | tee /dev/stderr | grep -Eq '^Version 7\.'

      - name: Format (oxfmt)
        run: |
          npx oxfmt --check || {
            npx oxfmt --list-different | sed 's/.*/::error file=&::Not formatted with oxfmt. Run npm run format (or the Format workflow)./'
            exit 1
          }

      - name: Lint (oxlint, type-aware)
        run: npx oxlint --format=github

      # GitHub shows at most 10 errors and 10 warnings per step, so on failure post the whole report too.
      - name: Full oxlint report
        if: failure()
        run: |
          npx oxlint --format=unix > oxlint-report.txt 2>&1 || true
          node -e "
            const text = require('fs').readFileSync('oxlint-report.txt', 'utf8');
            const esc = (s) => s.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
            for (let i = 0, n = 1; i < text.length && n <= 10; i += 3000, n++)
              console.log('::error title=oxlint report part ' + n + '::' + esc(text.slice(i, i + 3000)));
          "

      - run: npm run typecheck
      - run: npm test
