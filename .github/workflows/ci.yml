name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Type checking must use TypeScript 7, the native (Go) compiler.
      - name: Check TypeScript is 7.x (native compiler)
        run: npx tsc --version | tee /dev/stderr | grep -Eq '^Version 7\.'
      - run: npm run typecheck
      - run: npm test
